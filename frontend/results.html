  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const data = localStorage.getItem('searchResults');
      const results = JSON.parse(data || '[]');
  
      const container = document.getElementById("resultsTable");
  
      if (results.length === 0) {
        container.innerHTML = "<p>No results found.</p>";
        return;
      }
  
      let table = "<table><tr>";
      for (let key in results[0]) {
        table += `<th>${key}</th>`;
      }
      table += "</tr>";
  
      results.forEach(row => {
        table += "<tr>";
        for (let key in row) {
          if ((key === "PDF Link" || key === "HTML Link") && row[key]) {
            const label = key.replace(" Link", "");
            table += `<td><a href='${row[key]}' target="_blank">View ${label}</a></td>`;
          } else {
            table += `<td>${row[key]}</td>`;
          }
        }
        table += "</tr>";
      });
  
      table += "</table>";
      container.innerHTML = table;
    });
  </script>
  
</body>
