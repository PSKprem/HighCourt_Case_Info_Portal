<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>📝 Feedback Section</title>
  <style>
    :root {
      --bg-color: #f0f4f8;
      --text-color: #333;
      --card-bg: #ffffff;
      --highlight: #0c3c78;
      --shadow: rgba(0,0,0,0.1);
    }

    .dark-mode {
      --bg-color: #1e1e2f;
      --text-color: #f0f0f0;
    
      --card-bg: #2c2c3e;
      --highlight: #16cedc;
      --shadow: rgba(255, 255, 255, 0.1);
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 40px 20px;
      transition: background-color 0.3s, color 0.3s;
    }

    .feedback-container {
      max-width: 800px;
      margin: auto;
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px var(--shadow);
    }

    .feedback-container h2 {
      color: var(--highlight);
      text-align: center;
      margin-bottom: 20px;
    }

    .toggle-btn {
      display: block;
      margin: 0 auto 20px auto;
      padding: 8px 16px;
      background-color: var(--highlight);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .toggle-btn:hover {
      opacity: 0.9;
    }

    .feedback-form label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    .feedback-form input, .feedback-form textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      background-color: #fff;
    }

    .dark-mode .feedback-form input,
    .dark-mode .feedback-form textarea {
      background-color: #444;
      color: #fff;
      border: 1px solid #888;
    }

    .feedback-form textarea {
      resize: vertical;
      height: 120px;
    }

    .feedback-form button {
      margin-top: 20px;
      padding: 12px 20px;
      background-color: var(--highlight);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    .feedback-form button:hover {
      opacity: 0.9;
    }

    .submitted-feedback {
      margin-top: 30px;
    }

    .submitted-feedback h3 {
      color: var(--highlight);
      margin-bottom: 10px;
    }

    .feedback-item {
      border-left: 4px solid var(--highlight);
      background-color: #f9fbfd;
      padding: 10px 15px;
      margin-bottom: 15px;
      border-radius: 6px;
    }

    .dark-mode .feedback-item {
      background-color: #333947;
    }

    .feedback-item strong {
      color: var(--highlight);
    }
  </style>
</head>
<body>

  <div class="feedback-container">
    <h2>💬 We Value Your Feedback!</h2>
    <button class="toggle-btn" onclick="toggleTheme()">Toggle Dark/Bright Mode</button>

    <form class="feedback-form" onsubmit="submitFeedback(event)">
      <label for="name">Name</label>
      <input type="text" id="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="message">Your Feedback</label>
      <textarea id="message" required></textarea>

      <button type="submit">Submit Feedback</button>
    </form>

    <div class="submitted-feedback" id="submittedFeedback">
      <h3>📥 Submitted Feedback</h3>
      <!-- Feedback will appear here -->
    </div>
  </div>

  <script>
    function toggleTheme() {
      document.body.classList.toggle("dark-mode");
    }

    function submitFeedback(event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("message").value.trim();

      if (name && email && message) {
        const feedbackDiv = document.getElementById("submittedFeedback");

        const feedbackItem = document.createElement("div");
        feedbackItem.classList.add("feedback-item");

        feedbackItem.innerHTML = `
          <p><strong>${name}</strong> (${email})</p>
          <p>${message}</p>
        `;

        feedbackDiv.appendChild(feedbackItem);

        document.getElementById("name").value = "";
        document.getElementById("email").value = "";
        document.getElementById("message").value = "";
      }
    }
  </script>

</body>
</html>
